<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalenPulse</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="20" height="20">
      <span class="brand-name">CalenPulse</span>
      <span id="account" class="account"></span>
    </div>
    <div class="top-actions">
      <button id="open-grid" class="icon-btn" title="Сетка календаря">&#9638;</button>
      <button id="refresh" class="icon-btn" title="Обновить">&#8635;</button>
      <button id="settings" class="icon-btn" title="Настройки">&#9881;</button>
    </div>
  </header>

  <main id="main">
    <div id="filter-bar" class="filter-bar" hidden></div>

    <div id="connect-state" class="state-card" hidden>
      <h2>Подключите Google Календарь</h2>
      <p id="connect-text">События будут в боковой панели, а напоминания — в браузере, Telegram и Discord.</p>
      <button id="connect" class="primary">Подключить Google</button>
    </div>

    <div id="loading" class="state-card muted" hidden>Загрузка событий…</div>

    <div id="error-state" class="state-card error" hidden>
      <p id="error-text"></p>
      <button id="retry">Повторить</button>
    </div>

    <div id="next-card" class="next-card" hidden>
      <div class="next-label">Далее</div>
      <div id="next-title" class="next-title"></div>
      <div id="next-meta" class="next-meta"></div>
    </div>

    <div id="events"></div>

    <div id="empty" class="state-card empty" hidden>
      <p id="empty-title">На ближайшие две недели событий нет.</p>
      <p id="empty-text" class="muted">Создайте первое — оно сразу появится в Google Календаре.</p>
    </div>
  </main>

  <footer class="bottombar">
    <button id="new-event" class="primary wide">+ Новое событие</button>
  </footer>

  <dialog id="editor">
    <form id="event-form" novalidate>
      <div class="dialog-head">
        <h2 id="editor-title">Новое событие</h2>
        <button type="button" id="editor-close" class="icon-btn" title="Закрыть">&#10005;</button>
      </div>

      <label class="field">Календарь
        <select id="f-calendar"></select>
      </label>

      <label class="field">Название
        <input id="f-summary" required maxlength="200" autocomplete="off" placeholder="Например, созвон с командой">
      </label>

      <div class="field-row">
        <label class="field">Дата
          <span class="date-field">
            <input id="f-date" type="text" autocomplete="off" inputmode="numeric" maxlength="10" placeholder="06.11.2026">
            <button type="button" id="f-date-open" class="date-open" title="Выбрать дату из календаря">&#9638;</button>
          </span>
        </label>
        <label class="field">С
          <input id="f-start" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="07:00">
        </label>
        <label class="field">До
          <input id="f-end" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="08:00">
        </label>
      </div>

      <p id="form-preview" class="form-preview" hidden></p>

      <label class="field">Место
        <input id="f-location" maxlength="200" autocomplete="off" placeholder="Ссылка или адрес">
      </label>

      <label class="field">Описание
        <textarea id="f-description" rows="3" maxlength="2000"></textarea>
      </label>

      <p id="form-error" class="form-error" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="editor-delete" class="danger" hidden>Удалить</button>
        <span class="spacer"></span>
        <button type="button" id="editor-cancel">Отмена</button>
        <button type="submit" id="editor-save" class="primary">Сохранить</button>
      </div>
    </form>

    <div id="date-pop" class="date-pop" hidden>
      <div class="dp-head">
        <button type="button" id="dp-prev" class="icon-btn" title="Предыдущий месяц">&#8249;</button>
        <span id="dp-title" class="dp-title"></span>
        <button type="button" id="dp-next" class="icon-btn" title="Следующий месяц">&#8250;</button>
      </div>
      <div class="dp-weeks">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
      </div>
      <div id="dp-grid" class="dp-grid"></div>
      <button type="button" id="dp-today" class="dp-today">Сегодня</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
